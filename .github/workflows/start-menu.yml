name: Vista Start menu regression
on:
  push:
    branches: [fix/vista-start-tap-menus]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vista-start-${{ github.ref }}
  cancel-in-progress: true
jobs:
  start:
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest assembleDebug assembleDebugAndroidTest :fixture:assembleDebug --no-daemon
      - run: python3 checks/CheckTestManifest.py
      - name: Keep APKs and verification tools
        if: matrix.api == 30
        run: |
          mkdir -p build/signing-tool
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$ANDROID_HOME/build-tools/35.0.0/aapt" "$ANDROID_HOME/build-tools/35.0.0/zipalign" build/signing-tool/
          cp -r "$ANDROID_HOME/build-tools/35.0.0/lib64" build/signing-tool/
      - uses: actions/upload-artifact@v4
        if: matrix.api == 30
        with:
          name: Vista-0.26.5-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/signing-tool/
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          emulator-build: ${{ matrix.api == 30 && 15917651 || 16740729 }}
          arch: x86_64
          target: ${{ matrix.api == 30 && 'default' || 'aosp_atd' }}
          profile: pixel_2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: ${{ matrix.api == 30 && '-no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim' || '-no-window -gpu swangle -feature -Vulkan -no-snapshot -noaudio -no-boot-anim' }}
          disable-animations: true
          script: bash checks/run-start-menu-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vista-start-evidence-${{ matrix.api }}
          path: |
            start-menu-test.txt
            extended-taskbar-test.txt
            fidelity-test.txt
            screenshots/
            app/build/test-results/testDebugUnitTest/
