name: Vista taskbar regression
on:
  push:
    branches: [feature/vista-independent-rows]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vista-taskbar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  taskbar:
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check launcher state and layout geometry
        run: |
          mkdir -p build/state-check
          javac -d build/state-check app/src/main/java/com/nthexperience/desktop/LauncherState.java checks/LauncherStateCheck.java app/src/main/java/com/nthexperience/desktop/DesktopGeometry.java checks/DesktopGeometryCheck.java app/src/main/java/com/nthexperience/desktop/StartupPolicy.java checks/StartupPolicyCheck.java app/src/main/java/com/nthexperience/desktop/GadgetMath.java checks/GadgetMathCheck.java app/src/main/java/com/nthexperience/desktop/BrowserUrls.java checks/BrowserUrlsCheck.java app/src/main/java/com/nthexperience/desktop/DesktopMetrics.java checks/DesktopMetricsCheck.java app/src/main/java/com/nthexperience/desktop/ControlPanelCatalog.java checks/ControlPanelCatalogCheck.java app/src/main/java/com/nthexperience/desktop/WindowArrangement.java checks/WindowArrangementCheck.java app/src/main/java/com/nthexperience/desktop/TaskbarGrouping.java checks/TaskbarGroupingCheck.java
          java -cp build/state-check LauncherStateCheck
          java -cp build/state-check DesktopGeometryCheck
          java -cp build/state-check StartupPolicyCheck
          java -cp build/state-check com.nthexperience.desktop.GadgetMathCheck
          java -cp build/state-check com.nthexperience.desktop.BrowserUrlsCheck
          java -cp build/state-check com.nthexperience.desktop.DesktopMetricsCheck
          java -cp build/state-check com.nthexperience.desktop.ControlPanelCatalogCheck
          java -cp build/state-check com.nthexperience.desktop.WindowArrangementCheck
          java -cp build/state-check com.nthexperience.desktop.TaskbarGroupingCheck
      - run: ./gradlew :app:testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Check packaged test registrations
        run: python3 checks/CheckTestManifest.py
      - name: Keep APK verification tools
        if: matrix.api == 30
        run: |
          mkdir -p build/signing-tool
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" "$ANDROID_HOME/build-tools/35.0.0/aapt" "$ANDROID_HOME/build-tools/35.0.0/zipalign" build/signing-tool/
          cp -r "$ANDROID_HOME/build-tools/35.0.0/lib64" build/signing-tool/
      - uses: actions/upload-artifact@v4
        if: matrix.api == 30
        with:
          name: Nth-Desktop-Vista-0.26.4-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/signing-tool/
            app/build/test-results/testDebugUnitTest/
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run taskbar and Vista fidelity checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          emulator-build: 15917651
          arch: x86_64
          target: ${{ matrix.api == 30 && 'default' || 'aosp_atd' }}
          profile: pixel_2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash checks/run-taskbar-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vista-taskbar-evidence-${{ matrix.api }}
          path: |
            extended-taskbar-test.txt
            taskbar-rows-test.txt
            fidelity-test.txt
            app/build/test-results/testDebugUnitTest/
            screenshots/
