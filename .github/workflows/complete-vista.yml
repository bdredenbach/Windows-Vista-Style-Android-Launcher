name: Complete Vista handoff validation
on:
  push:
    branches: [build/vista-complete-signed-fixes]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: complete-vista-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify the pinned desktop preservation baseline
        run: |
          git worktree add --detach /tmp/vista-baseline 0f06e8f57df0ff6df88b84aaccf0c3127b04fdba
          python3 /tmp/vista-baseline/checks/CheckVistaBaseline.py
          git diff --exit-code 0f06e8f57df0ff6df88b84aaccf0c3127b04fdba -- app/src/main
      - name: Build and run handoff unit tests
        run: ./gradlew :app:testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Check packaged test registrations
        run: python3 checks/CheckTestManifest.py
      - name: Keep build verification tools
        if: matrix.api == 30
        run: |
          mkdir -p build/signing-tool
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/signing-tool/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" build/signing-tool/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" build/signing-tool/
      - uses: actions/upload-artifact@v4
        if: matrix.api == 30
        with:
          name: Vista-0.26.2-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            build/signing-tool/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vista-unit-results-${{ matrix.api }}
          path: app/build/test-results/testDebugUnitTest/
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run taskbar and existing Vista fidelity checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          emulator-build: 15917651
          arch: x86_64
          target: ${{ matrix.api == 30 && 'default' || 'aosp_atd' }}
          profile: pixel_2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 300
          script: bash checks/run-taskbar-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vista-complete-evidence-${{ matrix.api }}
          path: |
            extended-taskbar-test.txt
            fidelity-test.txt
            screenshots/
