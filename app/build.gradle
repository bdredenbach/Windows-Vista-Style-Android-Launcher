plugins { id 'com.android.application' }
android {
    namespace 'com.nthexperience.desktop'
    compileSdk 36
    defaultConfig {
        applicationId 'com.nthexperience.desktop'
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName '0.10.0'
        testInstrumentationRunner 'com.nthexperience.desktop.ExplorerSmoke'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { testImplementation "junit:junit:4.13.2" }

dependencies { testImplementation "org.robolectric:robolectric:4.16.1" }
